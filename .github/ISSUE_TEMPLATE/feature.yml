name: Feature
description: Propose a scoped feature
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user value
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable outcomes.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Test plan
      description: How will this be verified?
    validations:
      required: true
